<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilkades Serentak</title>
<style>
:root{--pri:#0f766e;--pri2:#14b8a6;--pri-soft:#ccfbf1;--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--red:#dc2626;--amb:#d97706;--grn:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#064e3b,var(--pri));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px}
.brand b{font-size:18px;display:block;line-height:1.1}.brand small{font-size:12px;opacity:.85}
nav{display:flex;gap:6px}
nav button{background:rgba(255,255,255,.12);color:#fff;border:0;padding:10px 14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
nav button.on{background:#fff;color:var(--pri)}
main{padding:18px 14px 60px}
h2{margin:6px 0 12px;font-size:22px}h3{margin:0 0 8px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat b{display:block;font-size:30px;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.desa{cursor:pointer;border:2px solid transparent;transition:.15s}.desa:hover{border-color:var(--pri2);transform:translateY(-2px)}
.desa h3{font-size:18px}.desa small{color:var(--mut)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-Belum{background:#e2e8f0;color:#475569}.b-Dibuka{background:#dcfce7;color:#166534}.b-Selesai{background:#dbeafe;color:#1e40af}.b-Pakai{background:#fef3c7;color:#92400e}
.bar-line{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar-line i{display:block;height:100%;background:var(--pri2)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:13px 12px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--tx)}
input[type=checkbox]{width:20px;height:20px;padding:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2)}
textarea{min-height:110px;resize:vertical}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;padding:13px 20px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn.sec{background:#e2e8f0;color:var(--tx)}.btn.red{background:var(--red)}.btn.amb{background:var(--amb)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}.btn.big{width:100%;font-size:19px;padding:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.sp{justify-content:space-between}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cand{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);position:relative;border:3px solid transparent}
.cand .ph{aspect-ratio:4/5;background:#e2e8f0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:60px;color:#94a3b8}
.cand .no{position:absolute;top:10px;left:10px;background:var(--pri);color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cand .in{padding:12px}.cand .in b{font-size:18px;display:block}
.cand details{margin-top:6px;font-size:14px;color:#334155}.cand summary{cursor:pointer;color:var(--pri);font-weight:600}
.cand .btn{margin-top:10px;width:100%;font-size:20px;padding:16px}
.hrow{display:flex;gap:12px;align-items:center;margin:12px 0}
.hrow img,.hrow .av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e2e8f0;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.hrow .t{flex:1}.hrow .nm{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.hrow .pb{height:20px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:4px}.hrow .pb i{display:block;height:100%;background:#94a3b8;border-radius:10px}
.hrow.win .pb i{background:var(--pri2)}.hrow.win .nm{color:var(--pri)}
.win-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:14px;padding:14px;font-size:18px;font-weight:700;margin-bottom:10px;text-align:center}
.center{text-align:center}.bigic{font-size:72px}
.msg{padding:12px;border-radius:12px;margin:10px 0;font-size:15px}.msg.err{background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}.msg.warn{background:#fef3c7;color:#92400e}.msg.info{background:#dbeafe;color:#1e3a8a}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{flex:none;background:#fff;border:2px solid var(--line);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden],[hidden]{display:none!important}
.box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:700;color:var(--pri)}
.spin{width:46px;height:46px;border:5px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px;margin-bottom:6px}.seg button{flex:1;background:#fff;border:2px solid var(--line);padding:11px;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* tata letak admin: menu di kiri */
.adm{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:84px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.side .who{padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}.side .who b{display:block;font-size:16px}.side .who small{color:var(--mut)}
.side .tabs{flex-direction:column;overflow:visible;margin:0 0 10px;padding:0;gap:4px}
.side .tabs button{text-align:left;border:0;background:transparent;width:100%;display:flex;gap:10px;align-items:center;padding:11px 12px}
.side .tabs button::before{content:attr(data-ic);width:22px;text-align:center}
.side .tabs button:hover:not(.on){background:#f1f5f9}
.side .tabs button.on{background:var(--pri);color:#fff}
.side .out{width:100%}
.ptitle{margin:0 0 12px}
@media(max-width:800px){.adm{grid-template-columns:minmax(0,1fr)}.side{position:static}.side .tabs{flex-direction:row;flex-wrap:wrap;overflow:visible;margin-bottom:8px}.side .tabs button{width:auto;padding:9px 11px;font-size:14px;gap:6px}.side .tabs button::before{width:auto}.side .who{display:none}.side .out{width:auto}}
/* mode pemilih (hasil scan QR) */
body.pemilih header{display:none}
.vhead{background:linear-gradient(135deg,#064e3b,var(--pri));color:#fff;border-radius:18px;padding:18px;text-align:center;margin-bottom:14px}
.vhead small{opacity:.85;display:block}.vhead h2{margin:4px 0;font-size:24px}
.vstat{max-width:520px;margin:20px auto;text-align:center}
.vstat .bigic{font-size:84px;line-height:1.1}.vstat h2{font-size:26px}.vstat p{font-size:18px}
#printArea{display:none}
.und-grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.und{border:1.5px solid #000;border-radius:6px;padding:6px 10px;font-size:11px;line-height:1.3;height:86mm;box-sizing:border-box;break-inside:avoid;page-break-inside:avoid;overflow:hidden;display:flex;flex-direction:column;color:#000;background:#fff}
.und .t{font-weight:800;font-size:15px;text-align:center;letter-spacing:.5px}.und .s{text-align:center;font-size:10.5px}
.und hr{border:0;border-top:1px solid #000;margin:4px 0}
.und .nm{font-size:13.5px;font-weight:800}.und .no{display:inline-block;border:1.5px solid #000;border-radius:4px;padding:1px 8px;font-weight:800;font-size:12.5px}
.und .mid{display:flex;gap:8px;align-items:center;justify-content:space-between}
.und .mid .l{flex:1;min-width:0}
.und .qr{flex:none;text-align:center;font-size:8.5px;font-weight:800;line-height:1.15}
.und .qr img{display:block;width:30mm;height:30mm;image-rendering:pixelated;image-rendering:crisp-edges}
.und .jd{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}.und .jl{flex:1;min-width:0}.und .ttd{flex:none;text-align:center;font-size:10px;line-height:1.2;min-width:32mm}.und .ttdi{height:9mm;display:flex;align-items:center;justify-content:center}.und .ttdi img{max-height:9mm;max-width:32mm}
.und .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:9.5px}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}#printArea h2{margin:0 0 8px;font-size:16px}
 #printArea table{font-size:12px}#printArea td,#printArea th{border:1px solid #000;padding:6px;height:30px;color:#000}
}
@media(max-width:560px){.cand .ph{aspect-ratio:1/1}.brand b{font-size:16px}nav button{padding:9px 10px;font-size:14px}h2{font-size:20px}}
/* halaman desa: dashboard layar penuh */
body.fs{background:#04302b}body.fs header{display:none}body.fs main{max-width:none;padding:0}
body.dadm nav{display:none}
.dv{background:linear-gradient(160deg,#04302b,#0b5c53 60%,#0f766e);color:#fff;border-radius:20px;padding:clamp(14px,2vw,32px);display:flex;flex-direction:column;gap:clamp(12px,1.6vw,24px)}
body.fs .dv{min-height:100vh;border-radius:0}
.dvh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.dvh h1{margin:2px 0;font-size:clamp(26px,4.2vw,60px);line-height:1.1}.dvh small{font-size:clamp(14px,1.6vw,24px);opacity:.85;display:block}
.dvb{padding:6px 18px;border-radius:99px;font-weight:800;background:#fff;color:var(--pri);font-size:clamp(14px,1.6vw,24px)}
.dvp{background:rgba(255,255,255,.1);border-radius:18px;padding:clamp(12px,1.6vw,24px)}
.dvt{margin:0 0 10px;font-size:clamp(18px,2.2vw,32px)}
.cdl{font-size:clamp(16px,2.4vw,34px);font-weight:700;text-align:center}
.cdb{display:flex;justify-content:center;gap:clamp(8px,1.6vw,22px);margin-top:10px}
.cdb div{background:rgba(0,0,0,.28);border-radius:16px;min-width:clamp(64px,13vw,190px);padding:clamp(8px,1.4vw,22px) 6px;text-align:center}
.cdb b{display:block;font-size:clamp(34px,8vw,120px);line-height:1;font-variant-numeric:tabular-nums}
.cdb small{font-size:clamp(11px,1.4vw,22px);opacity:.8;text-transform:uppercase;letter-spacing:1px}
.cds{text-align:center;margin-top:10px;opacity:.85;font-size:clamp(13px,1.5vw,22px)}
.dvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(8px,1.2vw,18px)}
.dvs>div{background:rgba(255,255,255,.1);border-radius:16px;padding:clamp(10px,1.4vw,22px);text-align:center}
.dvs b{display:block;font-size:clamp(30px,5vw,80px);line-height:1.05}.dvs span{font-size:clamp(12px,1.4vw,22px);opacity:.85}
.tpsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tpsc{background:rgba(0,0,0,.22);border-radius:14px;padding:14px;font-size:clamp(14px,1.3vw,20px)}
.dv .hrow .av{color:#0f172a}.dv .hrow.win .nm{color:#5eead4}.dv .bar-line{background:rgba(255,255,255,.2)}
</style>

<body>
<header><div class="wrap bar">
  <div class="brand">🗳️<div><b>Pilkades Serentak</b><small id="hdrSub">Pemilihan Kepala Desa</small></div></div>
  <nav>
    <button data-v="dash" class="on">Dashboard</button>
    <button data-v="admin">Admin</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-dash"></section>
  <section id="v-admin" hidden></section>
  <section id="v-pemilih" hidden></section>
  <section id="v-desa" hidden></section>
</main>

<div id="modal" class="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="loading" hidden><div class="spin"></div><div id="loadTxt"></div></div>
<div id="printArea"></div>

<script src="config.js"></script>
<script>/* Pembuat QR Code - JavaScript murni, tanpa pustaka luar dan tanpa layanan pihak ketiga.
   Mode byte (UTF-8), koreksi galat level M, versi 1-14 (hingga 362 karakter). */
var QR = (function () {
  // [byte koreksi per blok, [jumlah blok, byte data per blok], ...] untuk level M
  var TBL = {
    1: [10, [1, 16]], 2: [16, [1, 28]], 3: [26, [1, 44]], 4: [18, [2, 32]], 5: [24, [2, 43]], 6: [16, [4, 27]],
    7: [18, [4, 31]], 8: [22, [2, 38], [2, 39]], 9: [22, [3, 36], [2, 37]], 10: [26, [4, 43], [1, 44]],
    11: [30, [1, 50], [4, 51]], 12: [22, [6, 36], [2, 37]], 13: [22, [8, 37], [1, 38]], 14: [24, [4, 40], [5, 41]]
  };
  var EXP = [], LOG = [], i0, x0 = 1;
  for (i0 = 0; i0 < 255; i0++) { EXP[i0] = x0; LOG[x0] = i0; x0 <<= 1; if (x0 & 256) x0 ^= 0x11D; }
  for (i0 = 255; i0 < 512; i0++) EXP[i0] = EXP[i0 - 255];
  function mul(a, b) { return a && b ? EXP[LOG[a] + LOG[b]] : 0; }

  function rsGen(n) {
    var r = [1], i, j;
    for (i = 0; i < n; i++) {
      var nr = [];
      for (j = 0; j <= r.length; j++) nr.push(0);
      for (j = 0; j < r.length; j++) { nr[j] ^= r[j]; nr[j + 1] ^= mul(r[j], EXP[i]); }
      r = nr;
    }
    return r;
  }
  function rsRem(data, gen) {
    var n = gen.length - 1, res = [], i, j;
    for (i = 0; i < n; i++) res.push(0);
    for (i = 0; i < data.length; i++) {
      var f = data[i] ^ res[0];
      res.shift(); res.push(0);
      if (f) for (j = 0; j < n; j++) res[j] ^= mul(gen[j + 1], f);
    }
    return res;
  }

  function make(text, forceMask) {
    var bytes = Array.prototype.slice.call(new TextEncoder().encode(text)), ver, tb, cap, g, i, j, k;
    for (ver = 1; ver <= 14; ver++) {
      tb = TBL[ver]; cap = 0;
      for (g = 1; g < tb.length; g++) cap += tb[g][0] * tb[g][1];
      if (4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= cap * 8) break;
    }
    if (ver > 14) throw new Error('Teks terlalu panjang untuk QR Code.');

    // 1. bit data: mode byte + jumlah + isi + penutup + pengisi
    var bits = [];
    function put(v, n) { for (var q = n - 1; q >= 0; q--) bits.push((v >>> q) & 1); }
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16);
    for (i = 0; i < bytes.length; i++) put(bytes[i], 8);
    for (i = 0; i < 4 && bits.length < cap * 8; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    var data = [];
    for (i = 0; i < bits.length; i += 8) { var v = 0; for (j = 0; j < 8; j++) v = (v << 1) | bits[i + j]; data.push(v); }
    for (var pad = 0xEC; data.length < cap; pad ^= 0xEC ^ 0x11) data.push(pad);

    // 2. blok + koreksi galat Reed-Solomon, lalu diselang-seling
    var ecLen = tb[0], gen = rsGen(ecLen), blocks = [], pos = 0;
    for (g = 1; g < tb.length; g++) for (k = 0; k < tb[g][0]; k++) {
      var d = data.slice(pos, pos + tb[g][1]); pos += tb[g][1];
      blocks.push({ d: d, e: rsRem(d, gen) });
    }
    var out = [], maxD = blocks[blocks.length - 1].d.length;
    for (i = 0; i < maxD; i++) for (j = 0; j < blocks.length; j++) if (i < blocks[j].d.length) out.push(blocks[j].d[i]);
    for (i = 0; i < ecLen; i++) for (j = 0; j < blocks.length; j++) out.push(blocks[j].e[i]);

    // 3. matriks + pola fungsi
    var n = 17 + 4 * ver, M = [], F = [];
    for (i = 0; i < n; i++) { M.push([]); F.push([]); for (j = 0; j < n; j++) { M[i].push(false); F[i].push(false); } }
    function setF(x, y, dark) { if (x >= 0 && x < n && y >= 0 && y < n) { M[y][x] = dark; F[y][x] = true; } }
    for (i = 0; i < n; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    function finder(cx, cy) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var dist = Math.max(Math.abs(dx), Math.abs(dy));
        setF(cx + dx, cy + dy, dist !== 2 && dist !== 4);
      }
    }
    finder(3, 3); finder(n - 4, 3); finder(3, n - 4);
    var na = Math.floor(ver / 7) + 2, step = Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2, ap = [6];
    if (ver > 1) for (var p = n - 7; ap.length < na; p -= step) ap.splice(1, 0, p);
    else ap = [];
    for (i = 0; i < ap.length; i++) for (j = 0; j < ap.length; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) continue;
      for (var ay = -2; ay <= 2; ay++) for (var ax = -2; ax <= 2; ax++) setF(ap[i] + ax, ap[j] + ay, Math.max(Math.abs(ax), Math.abs(ay)) !== 1);
    }
    function format(mask) { // level M = 00
      var dd = mask, r = dd, q;
      for (q = 0; q < 10; q++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      var fb = ((dd << 10) | r) ^ 0x5412;
      function bit(t) { return ((fb >>> t) & 1) !== 0; }
      for (q = 0; q <= 5; q++) setF(8, q, bit(q));
      setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
      for (q = 9; q < 15; q++) setF(14 - q, 8, bit(q));
      for (q = 0; q < 8; q++) setF(n - 1 - q, 8, bit(q));
      for (q = 8; q < 15; q++) setF(8, n - 15 + q, bit(q));
      setF(8, n - 8, true);
    }
    format(0);
    if (ver >= 7) {
      var vr = ver, q2;
      for (q2 = 0; q2 < 12; q2++) vr = (vr << 1) ^ ((vr >>> 11) * 0x1F25);
      var vb = (ver << 12) | vr;
      for (q2 = 0; q2 < 18; q2++) {
        var bt = ((vb >>> q2) & 1) !== 0, a = n - 11 + (q2 % 3), b = Math.floor(q2 / 3);
        setF(a, b, bt); setF(b, a, bt);
      }
    }

    // 4. tempatkan bit data (zig-zag dari kanan-bawah)
    var idx = 0, total = out.length * 8;
    for (var right = n - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < n; vert++) for (j = 0; j < 2; j++) {
        var x = right - j, up = ((right + 1) & 2) === 0, y = up ? n - 1 - vert : vert;

async function quiet(fn, ...a) {

/** Kecilkan foto di peramban (sisi terpanjang <= 1000 px, JPEG) agar unggahan ringan. Hasil: data URL. */
function kecilkanFoto(file, opt) {
  opt = opt || {};
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let side = opt.side || 1000, q = 0.85, d = '';
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, side / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        const g = c.getContext('2d');
        if (!opt.png) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); } // PNG: latar transparan dipertahankan
        g.drawImage(img, 0, 0, c.width, c.height);
        d = opt.png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
        if (d.length < 700000) break;
        side *= 0.8; q = Math.max(0.6, q - 0.07);
      }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('File bukan gambar yang dapat dibaca. Gunakan JPG atau PNG.')); };
    img.src = url;
  });
}

      <div><b>${o.hadir}</b><span>Sudah hadir (${pct(o.hadir)}%)</span></div>
      <div><b>${o.sudah}</b><span>Sudah memilih (${pct(o.sudah)}%)</span></div>
      <div><b>${Math.max(0, o.dpt - o.sudah)}</b><span>Belum memilih</span></div></div>
    <div class="dvp"><h3 class="dvt">Rangkuman TPS (${o.tps.length})</h3>${tps}
      ${adm && o.tanpaTps ? `<div class="msg warn" style="margin-top:10px">${o.tanpaTps} pemilih belum masuk TPS manapun (RT-nya belum diatur ke TPS oleh Admin Kecamatan).</div>` : ''}</div>
    ${o.hasil ? hasilHtml(o.hasil) : ''}
    ${adm ? '' : `<div><h3 class="dvt">Calon Kepala Desa</h3>${o.calon.length ? `<div class="cands">${o.calon.map(candCard).join('')}</div>` : '<div style="opacity:.8">Belum ada calon.</div>'}</div>
      <div style="text-align:center;opacity:.75;margin-top:auto"><a href="${esc(BASE)}" style="color:#fff">← Dashboard Kecamatan</a></div>`}
  </div>`;
}
/** Kontrol Admin Desa: mulai lebih awal / akhiri lebih cepat. */
function ctlHtml(o) {
  const st = o.status;
  return `<div class="card"><div class="row sp" style="gap:14px"><div style="flex:1;min-width:240px"><h3 style="margin:0">Kontrol Pemilihan</h3>
      <small style="color:var(--mut)">Status: <b>${stLabel(st)}</b>. Pemilihan juga dibuka dan ditutup otomatis sesuai jadwal. Tombol ini untuk memulai lebih awal atau mengakhiri lebih cepat.</small></div>
    <div>${st === 'Belum' ? '<button class="btn" onclick="mulaiPilih()">▶ Mulai Pemilihan</button>' : st === 'Dibuka' ? '<button class="btn red" onclick="akhiriPilih()">■ Akhiri Pemilihan</button>' : '<span class="badge b-Selesai">Pemilihan selesai</span>'}</div></div>
    ${st === 'Belum' && !o.calon.length ? '<div class="msg warn">Belum ada calon. Admin Kecamatan perlu menambahkan calon sebelum pemilihan dapat dimulai.</div>' : ''}</div>`;
}
async function mulaiPilih() {
  if (!confirm('Mulai pemilihan Desa ' + S.dv.desa.Nama + ' sekarang?\n\nSetelah dimulai, data calon dan pengaturan TPS dikunci, dan pemilih dapat scan QR Code untuk memilih.')) return;
  try { await run('apiMulaiPemilihan', S.token, S.dvId); toast('Pemilihan dimulai.'); reloadAdmin(); } catch (e) { adminErr(e); }
}
async function akhiriPilih() {
  if (!confirm('AKHIRI pemilihan Desa ' + S.dv.desa.Nama + ' sekarang?\n\nTindakan ini TIDAK dapat dibatalkan. Pemilih yang belum memilih tidak dapat memilih lagi, dan hasil suara langsung tampil di halaman publik.')) return;
  try { await run('apiAkhiriPemilihan', S.token, S.dvId); toast('Pemilihan diakhiri.'); reloadAdmin(); } catch (e) { adminErr(e); }
}
function tDash() {
  S.dvMode = 'admin'; S.dvId = S.selDesa; S.dv = null;
  $('#tabBody').innerHTML = '<div id="dvBox"></div>';
  ensureCd(); refreshDv(false);
  S.pt = setInterval(() => { if (document.hidden || S.view !== 'admin' || S.tab !== 'dash' || !$('#dvBox')) return; refreshDv(true); }, 10000);
}
function halamanGagal(msg) {
  document.body.classList.remove('fs'); document.body.classList.add('pemilih');
  ['dash', 'admin'].forEach(x => $('#v-' + x).hidden = true);
  $('#v-desa').hidden = false;
  $('#v-desa').innerHTML = `<div class="vstat card"><div class="bigic">🔎</div><h2>Halaman tidak tersedia</h2><p>${esc(msg)}</p><a class="btn" href="${esc(BASE)}">Ke Dashboard Kecamatan</a></div>`;
}
async function mulaiHalaman(slug) {
  S.view = 'desa';
  ['dash', 'admin'].forEach(x => $('#v-' + x).hidden = true);
  let h;
  try { h = await run('apiHalaman', slug); } catch (e) { return halamanGagal(e.message); }
  document.title = (h.tipe === 'admin' ? 'Admin Desa ' : 'Desa ') + h.Nama + ' — Pilkades Serentak';
  return h.tipe === 'admin' ? mulaiAdminDesa(h) : mulaiPublikDesa(h);
}
async function mulaiPublikDesa(h) {
  document.body.classList.add('fs');
  S.dvMode = 'publik'; S.dvId = h.ID;
  $('#v-desa').hidden = false;
  ensureCd();
  await refreshDv(false);
  S.dvT = setInterval(() => { if (!document.hidden) refreshDv(true); }, 10000);
}
function mulaiAdminDesa(h) {
  document.body.classList.add('dadm');
  S.fixDesa = h.ID; S.fixNama = h.Nama; S.fixSlug = h.Halaman; S.selDesa = h.ID; S.view = 'admin';
  $('#hdrSub').textContent = 'Admin Desa ' + h.Nama;
  $('#v-admin').hidden = false;
  renderAdmin();
}

/* ====================== MULAI ====================== */
(async () => {
  if (!API_URL) { document.body.classList.add('pemilih'); $('#v-dash').hidden = true; $('#v-pemilih').hidden = false; return vStatus('⚙️', 'Belum dikonfigurasi', 'Isi <b>API_URL</b> pada file <b>config.js</b> dengan alamat Web app Apps Script (berakhiran /exec).'); }
  const kode = await bacaKode();
  if (kode) return mulaiPemilih(kode);
  const hal = (new URLSearchParams(location.search).get('p') || '').trim().toLowerCase();
  if (hal) { history.replaceState(null, '', BASE + hal); return mulaiHalaman(hal); } // dari 404.html
  await loadPub();
  if (S.token && sget('view') === 'admin') return go('admin'); // kembali ke panel admin setelah refresh
  renderDash();
})();
</script>
</body>
</html>
